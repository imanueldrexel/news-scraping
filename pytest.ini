[pytest]
# DBT-25 (#82): bound every test so a regression that loops forever (SYS-28's
# shape -- a fetch loop whose cursor never advances) fails red instead of hanging
# the run; without this, mutation-testing such a fix "reproduces the bug" as a
# stuck pytest process rather than a failure. 120 s is several times the slowest
# legitimate test (the integration tests that load the embedding model take
# ~10-30 s). Needs pytest-timeout (pinned in requirements.txt); on Windows the
# only available method is `thread`, which on expiry dumps every thread's stack
# and terminates the whole pytest process -- so a timeout is always loud, never
# a silently skipped test.
timeout = 120
timeout_method = thread
